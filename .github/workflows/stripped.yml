name: stripped

on:
  push:
    branches: [stripped-0.163.0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libcap-dev libssl-dev pkg-config clang
      - name: Check changed crate formatting
        run: cargo fmt -p codex-analytics -p codex-feedback -p codex-otel -p codex-http-client -p codex-core -p codex-app-server -p codex-cli -p codex-instruction-control -p codex-home -p codex-hooks -p codex-skills-extension -p codex-git-attribution -p codex-config -p codex-history -- --check
      - name: Check full CLI without Guardian or OpenTelemetry
        run: cargo check --locked -p codex-cli
      - name: Test telemetry removal and retained local diagnostics
        run: cargo test --locked -p codex-analytics -p codex-feedback -p codex-otel -- --test-threads=1
      - name: Diagnose HTTP test environment
        if: ${{ !cancelled() }}
        run: |
          for key in CODEX_CA_CERTIFICATE SSL_CERT_FILE; do
            if [[ -v "$key" ]]; then echo "$key=set"; else echo "$key=unset"; fi
          done
          cargo tree --locked -p codex-http-client -e features -i reqwest@0.12.28
      - name: Test HTTP client independently
        if: ${{ !cancelled() }}
        run: cargo test --locked -p codex-http-client -- --test-threads=1
      - name: Test configuration and metadata boundaries
        if: ${{ !cancelled() }}
        run: cargo test --locked -p codex-core --test stripped_config -- --test-threads=1
      - name: Test accepted instruction sources and local attribution
        if: ${{ !cancelled() }}
        run: cargo test --locked -p codex-instruction-control -p codex-home -p codex-hooks -p codex-skills-extension -p codex-git-attribution -- --test-threads=1
      - name: Test instruction verification and session reconstruction
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p codex-core --lib instruction_policy:: -- --test-threads=1
          cargo test --locked -p codex-core --lib resume_instructions -- --test-threads=1
          cargo test --locked -p codex-core --lib instruction_context -- --test-threads=1
          cargo test --locked -p codex-core --lib config::protected_managed -- --test-threads=1
          cargo test --locked -p codex-core --lib config::instruction_settings -- --test-threads=1
          cargo test --locked -p codex-core --lib agents_md_tests:: -- --test-threads=1
          cargo test --locked -p codex-core --lib exec_policy -- --test-threads=1
      - name: Test protected backend routing
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p codex-cli --bin codex protected_backend_routes -- --test-threads=1
          cargo test --locked -p codex-tui --lib protected_ -- --test-threads=1
      - name: Test model independent prefix rules
        if: ${{ !cancelled() }}
        run: cargo test --locked -p codex-core --test suite prefix_rules_model_independence -- --test-threads=1
      - name: Build coding and research CLI
        if: ${{ !cancelled() }}
        run: cargo build --locked -p codex-cli --bin codex
      - name: Check CLI startup
        if: ${{ !cancelled() }}
        run: |
          target/debug/codex --version
          target/debug/codex exec --help

  windows-build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc
      - uses: ./.github/actions/setup-msvc-env
        with:
          target: x86_64-pc-windows-msvc
      - name: Build stripped Windows CLI
        run: cargo build --locked -p codex-cli -p codex-instruction-control -p codex-code-mode-host -p codex-responses-api-proxy -p codex-windows-sandbox -p codex-windows-sandbox-service --bin codex --bin codex-policy-manager --bin codex-code-mode-host --bin codex-responses-api-proxy --bin codex-windows-sandbox-setup --bin codex-windows-sandbox-service --bin codex-command-runner
      - name: Test protected instruction manager on Windows
        run: cargo test --locked -p codex-instruction-control -- --test-threads=1
      - name: Verify Windows executable
        run: |
          ./target/debug/codex.exe --version
          ./target/debug/codex.exe exec --help
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: codex-stripped-windows-x86_64
          path: |
            codex-rs/target/debug/codex.exe
            codex-rs/target/debug/codex-code-mode-host.exe
            codex-rs/target/debug/codex-responses-api-proxy.exe
            codex-rs/target/debug/codex-windows-sandbox-setup.exe
            codex-rs/target/debug/codex-windows-sandbox-service.exe
            codex-rs/target/debug/codex-command-runner.exe
            codex-rs/target/debug/codex-policy-manager.exe
          if-no-files-found: error
